name: Build BMD Curtain Remote APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create clean Android project
        shell: bash
        run: |
          set -euo pipefail

          # Ignore the broken Kotlin project currently in the repository.
          rm -rf app
          rm -f settings.gradle settings.gradle.kts build.gradle build.gradle.kts gradle.properties

          mkdir -p app/src/main/java/com/bmdhaulage/curtainremote
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BMD-Curtain-Remote"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bmdhaulage.curtainremote'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bmdhaulage.curtainremote'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bmd_red">#D71920</color>
              <color name="bmd_dark">#111111</color>
              <color name="bmd_background">#F3F3F3</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">BMD Curtain Remote</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">@color/bmd_red</item>
                  <item name="android:navigationBarColor">@color/bmd_dark</item>
                  <item name="android:statusBarColor">@color/bmd_dark</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/bmdhaulage/curtainremote/MainActivity.java <<'EOF'
          package com.bmdhaulage.curtainremote;

          import android.app.Activity;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.OutputStream;
          import java.net.InetSocketAddress;
          import java.net.Socket;

          public class MainActivity extends Activity {
              private EditText ipField;
              private EditText portField;
              private TextView status;

              private static final String OPEN_ON = "A00101A2";
              private static final String OPEN_OFF = "A00100A1";
              private static final String CLOSE_ON = "A00201A3";
              private static final String CLOSE_OFF = "A00200A2";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildUi();
              }

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(0xFF111111);
                  return t;
              }

              private Button button(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(16);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  b.setMinHeight(dp(52));
                  return b;
              }

              private String pref(String key, String fallback) {
                  return getPreferences(0).getString(key, fallback);
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(18), dp(18), dp(24));
                  root.setBackgroundColor(0xFFF3F3F3);
                  scroll.addView(root);

                  TextView brand = text("BMD HAULAGE", 28);
                  brand.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  brand.setTextColor(0xFFD71920);
                  brand.setGravity(Gravity.CENTER);
                  root.addView(brand, new LinearLayout.LayoutParams(-1, dp(55)));

                  TextView title = text("CURTAIN REMOTE", 18);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, new LinearLayout.LayoutParams(-1, dp(38)));

                  LinearLayout ipRow = new LinearLayout(this);
                  ipRow.setOrientation(LinearLayout.HORIZONTAL);
                  ipRow.setGravity(Gravity.CENTER_VERTICAL);

                  ipField = new EditText(this);
                  ipField.setHint("IP address");
                  ipField.setSingleLine(true);
                  ipField.setText(pref("ip", "192.168.4.1"));
                  ipField.setInputType(1);
                  ipRow.addView(ipField, new LinearLayout.LayoutParams(0, dp(55), 2));

                  portField = new EditText(this);
                  portField.setHint("Port");
                  portField.setSingleLine(true);
                  portField.setText(pref("port", "8080"));
                  portField.setInputType(2);
                  LinearLayout.LayoutParams pp =
                          new LinearLayout.LayoutParams(0, dp(55), 1);
                  pp.leftMargin = dp(8);
                  ipRow.addView(portField, pp);

                  root.addView(ipRow);

                  Button save = button("Save connection");
                  LinearLayout.LayoutParams sp =
                          new LinearLayout.LayoutParams(-1, dp(52));
                  sp.topMargin = dp(6);
                  root.addView(save, sp);

                  save.setOnClickListener(v -> {
                      getPreferences(0).edit()
                              .putString("ip", ipField.getText().toString().trim())
                              .putString("port", portField.getText().toString().trim())
                              .apply();
                      Toast.makeText(this, "Connection saved", Toast.LENGTH_SHORT).show();
                  });

                  status = text("Ready — TCP", 14);
                  status.setGravity(Gravity.CENTER);
                  root.addView(status, new LinearLayout.LayoutParams(-1, dp(42)));

                  Button open = button("OPEN");
                  Button close = button("CLOSE");

                  LinearLayout.LayoutParams bp =
                          new LinearLayout.LayoutParams(-1, dp(64));
                  bp.topMargin = dp(6);
                  root.addView(open, bp);
                  root.addView(close, new LinearLayout.LayoutParams(-1, dp(64)));

                  TextView advanced = text("Manual commands", 17);
                  advanced.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  advanced.setPadding(0, dp(20), 0, dp(6));
                  root.addView(advanced);

                  Button openOn = button("Open ON");
                  Button openOff = button("Open OFF");
                  Button closeOn = button("Close ON");
                  Button closeOff = button("Close OFF");

                  root.addView(openOn, new LinearLayout.LayoutParams(-1, dp(55)));
                  root.addView(openOff, new LinearLayout.LayoutParams(-1, dp(55)));
                  root.addView(closeOn, new LinearLayout.LayoutParams(-1, dp(55)));
                  root.addView(closeOff, new LinearLayout.LayoutParams(-1, dp(55)));

                  open.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          sendHex(OPEN_ON);
                          return true;
                      }
                      if (event.getAction() == MotionEvent.ACTION_UP ||
                          event.getAction() == MotionEvent.ACTION_CANCEL) {
                          sendHex(OPEN_OFF);
                          v.performClick();
                          return true;
                      }
                      return true;
                  });

                  close.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          sendHex(CLOSE_ON);
                          return true;
                      }
                      if (event.getAction() == MotionEvent.ACTION_UP ||
                          event.getAction() == MotionEvent.ACTION_CANCEL) {
                          sendHex(CLOSE_OFF);
                          v.performClick();
                          return true;
                      }
                      return true;
                  });

                  openOn.setOnClickListener(v -> sendHex(OPEN_ON));
                  openOff.setOnClickListener(v -> sendHex(OPEN_OFF));
                  closeOn.setOnClickListener(v -> sendHex(CLOSE_ON));
                  closeOff.setOnClickListener(v -> sendHex(CLOSE_OFF));

                  TextView info = text(
                          "TCP • HEX commands • Default 192.168.4.1:8080", 12);
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, dp(16), 0, 0);
                  root.addView(info);

                  setContentView(scroll);
              }

              private void sendHex(String hex) {
                  final String ip = ipField.getText().toString().trim();
                  final String portText = portField.getText().toString().trim();

                  if (ip.isEmpty() || portText.isEmpty()) {
                      Toast.makeText(this, "Enter IP and port", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  final int port;
                  try {
                      port = Integer.parseInt(portText);
                  } catch (NumberFormatException e) {
                      Toast.makeText(this, "Invalid port", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  status.setText("Sending " + hex + "…");

                  new Thread(() -> {
                      try {
                          byte[] data = hexToBytes(hex);

                          try (Socket socket = new Socket()) {
                              socket.connect(new InetSocketAddress(ip, port), 1000);
                              OutputStream output = socket.getOutputStream();
                              output.write(data);
                              output.flush();
                          }

                          runOnUiThread(() ->
                                  status.setText("Sent " + hex + " to " + ip + ":" + port));
                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              status.setText("Send failed");
                              String msg = e.getMessage() == null
                                      ? "Network error"
                                      : e.getMessage();
                              Toast.makeText(this, msg, Toast.LENGTH_LONG).show();
                          });
                      }
                  }).start();
              }

              private byte[] hexToBytes(String s) {
                  int len = s.length();
                  if ((len & 1) != 0) {
                      throw new IllegalArgumentException("Invalid HEX");
                  }

                  byte[] out = new byte[len / 2];
                  for (int i = 0; i < len; i += 2) {
                      out[i / 2] =
                              (byte) Integer.parseInt(s.substring(i, i + 2), 16);
                  }
                  return out;
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMD-Curtain-Remote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
